services:
  toolhome:
    image: ghcr.io/crayonlu/toolhome:latest
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3344:3344'
    environment:
      TOOLHOME_HOST: 0.0.0.0
      TOOLHOME_PORT: 3344
      TOOLHOME_PUBLIC_URL: ${TOOLHOME_PUBLIC_URL:-http://127.0.0.1:3344}
      TOOLHOME_DATA_DIR: /data
      TOOLHOME_MASTER_KEY: ${TOOLHOME_MASTER_KEY:?set TOOLHOME_MASTER_KEY}
      TOOLHOME_BOOTSTRAP_CONTROL_KEY: ${TOOLHOME_BOOTSTRAP_CONTROL_KEY:?set TOOLHOME_BOOTSTRAP_CONTROL_KEY}
      TOOLHOME_ALLOWED_HOSTS: ${TOOLHOME_ALLOWED_HOSTS:-127.0.0.1,localhost}
      TOOLHOME_LOG_LEVEL: ${TOOLHOME_LOG_LEVEL:-info}
      TOOLHOME_OAUTH_URL_CLIENT_ID: ${TOOLHOME_OAUTH_URL_CLIENT_ID:-true}
      TOOLHOME_UV_INDEX_URL: ${TOOLHOME_UV_INDEX_URL:-}
      TOOLHOME_CALLS_RETENTION_DAYS: ${TOOLHOME_CALLS_RETENTION_DAYS:-30}
    volumes:
      - toolhome-data:/data
      # docker-kind Market entries (e.g. markitdown) spawn sibling containers
      # via the host socket; the runtime user must be in the host docker group.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GROUP_ID:-999}"
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

volumes:
  toolhome-data:
