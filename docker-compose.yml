services:
  toolhome:
    image: ghcr.io/crayonlu/toolhome:latest
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3344:3344'
    environment:
      MCP_HOME_HOST: 0.0.0.0
      MCP_HOME_PORT: 3344
      MCP_HOME_PUBLIC_URL: ${MCP_HOME_PUBLIC_URL:-http://127.0.0.1:3344}
      MCP_HOME_DATA_DIR: /data
      MCP_HOME_MASTER_KEY: ${MCP_HOME_MASTER_KEY:?set MCP_HOME_MASTER_KEY}
      MCP_HOME_BOOTSTRAP_CONTROL_KEY: ${MCP_HOME_BOOTSTRAP_CONTROL_KEY:?set MCP_HOME_BOOTSTRAP_CONTROL_KEY}
      MCP_HOME_ALLOWED_HOSTS: ${MCP_HOME_ALLOWED_HOSTS:-127.0.0.1,localhost}
      MCP_HOME_LOG_LEVEL: ${MCP_HOME_LOG_LEVEL:-info}
      MCP_HOME_OAUTH_URL_CLIENT_ID: ${MCP_HOME_OAUTH_URL_CLIENT_ID:-true}
      MCP_HOME_UV_INDEX_URL: ${MCP_HOME_UV_INDEX_URL:-}
      MCP_HOME_CALLS_RETENTION_DAYS: ${MCP_HOME_CALLS_RETENTION_DAYS:-30}
    volumes:
      - toolhome-data:/data
      # docker-kind Market entries (e.g. markitdown) spawn sibling containers
      # via the host socket; the runtime user must be in the host docker group.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GROUP_ID:-999}"
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'

volumes:
  toolhome-data:
