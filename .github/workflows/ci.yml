name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Server deps
        run: npm ci
      - name: Server typecheck
        run: npm run check
      - name: Server tests
        run: npm run test
      - name: Web deps
        working-directory: web
        run: npm ci
      - name: Web typecheck
        working-directory: web
        run: npm run typecheck
      - name: Web tests
        working-directory: web
        run: npm test

  docker:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build server dist
        run: |
          npm ci
          npm run build:server
      - name: Build web dist
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Install uv (for the real-market smoke test)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Curated install smoke test
        run: npm run smoke:market
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/crayonlu/toolhome:latest
            ghcr.io/crayonlu/toolhome:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub CLI image
        run: |
          cat > /tmp/gh.Dockerfile <<'EOF'
          FROM alpine:3.20
          ARG GH_VERSION=2.97.0
          RUN apk add --no-cache ca-certificates curl git \
           && curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tgz \
           && tar -xzf /tmp/gh.tgz -C /tmp \
           && install -m 0755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh \
           && rm -rf /tmp/gh.tgz "/tmp/gh_${GH_VERSION}_linux_amd64"
          EOF
          docker build -f /tmp/gh.Dockerfile -t toolhome/gh-cli:2.97.0 /tmp
          docker save toolhome/gh-cli:2.97.0 | gzip > gh-cli-image.tar.gz
      - name: Ship gh image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: 'gh-cli-image.tar.gz'
          target: '/tmp/'
      - name: Deploy to Aliyun
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd /opt/mcp-home
            if [ -f .env ] && grep -q '^MCP_HOME_' .env; then
              env_tmp="$(mktemp .env.tmp.XXXXXX)"
              sed -E 's/^MCP_HOME_/TOOLHOME_/' .env > "$env_tmp"
              chmod 600 "$env_tmp"
              mv "$env_tmp" .env
            fi
            if [ -f docker-compose.yml ] && grep -q 'MCP_HOME_' docker-compose.yml; then
              compose_tmp="$(mktemp docker-compose.yml.tmp.XXXXXX)"
              sed -E 's/MCP_HOME_/TOOLHOME_/g' docker-compose.yml > "$compose_tmp"
              chmod 644 "$compose_tmp"
              mv "$compose_tmp" docker-compose.yml
            fi
            if grep -q '^MCP_HOME_' .env || grep -q 'MCP_HOME_' docker-compose.yml; then
              echo 'legacy MCP_HOME environment variables remain' >&2
              exit 1
            fi
            grep -q '^TOOLHOME_MASTER_KEY=' .env
            grep -q 'TOOLHOME_MASTER_KEY' docker-compose.yml
            if [ -f /tmp/gh-cli-image.tar.gz ]; then
              docker load -i /tmp/gh-cli-image.tar.gz
              rm -f /tmp/gh-cli-image.tar.gz
            fi
            docker compose pull
            docker compose up -d
            docker image prune -f
