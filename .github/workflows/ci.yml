name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Two runs deploying at once collide on the server (concurrent `docker system
# prune` fails the deploy step) and on the registry push, so serialize them.
# Newer commits still win: an in-flight run is cancelled rather than queued.
concurrency:
  group: toolhome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Server deps
        run: npm ci
      - name: Server typecheck
        run: npm run check
      - name: Server build for process tests
        run: npm run build:server
      - name: Server tests
        run: npm run test
      - name: Web deps
        working-directory: web
        run: npm ci
      - name: Web typecheck
        working-directory: web
        run: npm run typecheck
      - name: Web tests
        working-directory: web
        run: npm test

  docker:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Build server dist
        run: |
          npm ci
          npm run build:server
      - name: Build web dist
        working-directory: web
        run: |
          npm ci
          npm run build
      # The deploy job runs in a separate checkout, and both directories are
      # gitignored, so they have to travel as an artifact.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: toolhome-build
          path: |
            dist
            web/dist
          if-no-files-found: error
      - name: Install uv (for the real-market smoke test)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Curated install smoke test
        run: npm run smoke:market
      - name: Verify self-hosted GitHub CLI image recipe
        run: |
          node --input-type=module -e 'import { marketCatalog } from "./dist/server/market/catalog.js"; process.stdout.write(marketCatalog.find(entry => entry.id === "gh-cli").installer.dockerfile)' | docker build -t toolhome-gh-cli-smoke -
          docker run --rm toolhome-gh-cli-smoke --version
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/crayonlu/toolhome:latest
            ghcr.io/crayonlu/toolhome:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repository }}
      - name: Export app image for offline load
        run: |
          docker pull ghcr.io/crayonlu/toolhome:latest
          docker save ghcr.io/crayonlu/toolhome:latest | gzip > toolhome-app-image.tar.gz
      - name: Upload app image artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolhome-app-image
          path: toolhome-app-image.tar.gz
          retention-days: 1

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: toolhome-build
      - name: Build GitHub CLI image
        run: |
          cat > /tmp/gh.Dockerfile <<'EOF'
          FROM alpine:3.20
          ARG GH_VERSION=2.97.0
          # No GH_HOST: the deployment host reaches api.github.com directly
          # (verified from inside a container on it), while the Cloudflare Worker
          # relay that used to be baked in here stopped answering and made every
          # `gh` call hang until it timed out. Set GH_HOST only if the deployment
          # network loses that direct route again.
          RUN apk add --no-cache ca-certificates curl git \
           && curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" -o /tmp/gh.tgz \
           && tar -xzf /tmp/gh.tgz -C /tmp \
           && install -m 0755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh \
           && rm -rf /tmp/gh.tgz "/tmp/gh_${GH_VERSION}_linux_amd64"
          EOF
          docker build -f /tmp/gh.Dockerfile -t toolhome/gh-cli:2.97.0 /tmp
          docker save toolhome/gh-cli:2.97.0 | gzip > gh-cli-image.tar.gz
      # The app image is built on the server instead of being shipped: it is
      # ~1.4 GB, and only dist/, web/dist/ and the manifest change per deploy, so
      # the npm/apk/uv layers stay cached there and a few MB cross the network.
      - name: Ship build context and gh image
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: 'gh-cli-image.tar.gz,dist/**,web/dist/**,package.json,package-lock.json,Dockerfile'
          target: '/opt/mcp-home/build/'
          strip_components: 0
          overwrite: true
      - name: Deploy to Aliyun
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd /opt/mcp-home
            if [ -f .env ] && grep -q '^MCP_HOME_' .env; then
              env_tmp="$(mktemp .env.tmp.XXXXXX)"
              sed -E 's/^MCP_HOME_/TOOLHOME_/' .env > "$env_tmp"
              chmod 600 "$env_tmp"
              mv "$env_tmp" .env
            fi
            if [ -f docker-compose.yml ] && grep -q 'MCP_HOME_' docker-compose.yml; then
              compose_tmp="$(mktemp docker-compose.yml.tmp.XXXXXX)"
              sed -E 's/MCP_HOME_/TOOLHOME_/g' docker-compose.yml > "$compose_tmp"
              chmod 644 "$compose_tmp"
              mv "$compose_tmp" docker-compose.yml
            fi
            if grep -q '^MCP_HOME_' .env || grep -q 'MCP_HOME_' docker-compose.yml; then
              echo 'legacy MCP_HOME environment variables remain' >&2
              exit 1
            fi
            grep -q '^TOOLHOME_MASTER_KEY=' .env
            grep -q 'TOOLHOME_MASTER_KEY' docker-compose.yml
            if [ -f build/gh-cli-image.tar.gz ]; then
              docker load -i build/gh-cli-image.tar.gz
              rm -f build/gh-cli-image.tar.gz
            fi
            # Cached layers: npm/apk/uv are keyed on package-lock.json and the
            # Dockerfile, so a normal deploy only re-copies dist and web-dist.
            # .build-env may point the mirrors at a local CDN on slow networks.
            if [ -f .build-env ]; then set -a; . ./.build-env; set +a; fi
            docker build \
              --build-arg "APK_MIRROR=${BUILD_APK_MIRROR:-dl-cdn.alpinelinux.org}" \
              --build-arg "NPM_REGISTRY=${BUILD_NPM_REGISTRY:-https://registry.npmjs.org}" \
              -t ghcr.io/crayonlu/toolhome:latest build
            docker image inspect ghcr.io/crayonlu/toolhome:latest >/dev/null
            docker compose up -d
            docker image prune -f
